# Automatic log analysis on players' issues: when an issue is opened or edited or gets a comment, dm/tools/issue_digest_comment.py digests every log in it
# (scripts/issue_digest.py, dm/tools/log_digest.py) and posts the result as one comment, which later runs edit. An issue without a log gets no comment.
# Forgejo runs only .forgejo/workflows when the folder exists, so the GitHub workflows in .github/workflows do not run on Forgejo.
# Needs: Actions on for the repository, a runner with the `docker` label, and the secret ISSUE_DIGEST_TOKEN (a token of the account that should post,
# scope write:issue) or, without it, the run's own token. The logs are untrusted input: the job reads them as text only, with no other secret.
name: issue-digest

on:
  issues:
    types: [opened, edited, reopened]
  issue_comment:
    types: [created, edited]

permissions:
  issues: write
  contents: read

concurrency:
  group: issue-digest-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  digest:
    # Issues only (a pull request's comments come as issue_comment too), and never the job's own comment
    if: >-
      ${{ !github.event.issue.pull_request &&
          (github.event_name != 'issue_comment' || !contains(github.event.comment.body, 'bananative-issue-digest')) }}
    runs-on: docker
    container:
      image: node:20-bookworm   # python3 is in the image; the tools need nothing outside its standard library
    timeout-minutes: 10
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/issue_digest.py
            /scripts/bug_report.py
            /dm/tools/issue_digest_comment.py
            /dm/tools/log_digest.py
            /dm/tools/log_rules.tsv
            /dm/tools/log_noise.tsv
            /docs/agents/symptoms.md
            /dm/games/*/game.tsv
            /dm/gfx/nvn/dmsh_chain.h
      - name: Digest the issue's logs and comment
        env:
          FORGEJO_TOKEN: ${{ secrets.ISSUE_DIGEST_TOKEN || github.token }}
          BN_FORGEJO: ${{ github.server_url }}
          BN_FORGEJO_REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          export BN_ISSUES_DIR="$(mktemp -d)"
          python3 dm/tools/issue_digest_comment.py "$ISSUE"
